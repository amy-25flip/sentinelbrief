[project]
name = "sentinelbrief"
version = "0.1.0"
description = "Indian cyber-regulatory compliance: obligation dataset, incident clock, filing copilot, and card feed"
readme = "README.md"
authors = [
    { name = "Amar Yempalle" }
]
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
dependencies = [
    # Core
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    # PDF extraction
    "pymupdf>=1.25,<2",
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "jinja2>=3.1,<4",
    # Hashing / crypto
    "pynacl>=1.5,<2",
    # Data
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    # Utilities
    "python-dateutil>=2.9,<3",
    "rich>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "hypothesis>=6.115,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6,<7",
    "types-python-dateutil>=2,<3",
    "types-jsonschema>=4,<5",
    "respx>=0.22,<1",
]

[project.scripts]
sentinelbrief = "sentinelbrief.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelbrief"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelbrief"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that require network access (deselect with '-m not live')",
    "llm: marks tests that require an LLM API key (deselect with '-m not llm')",
]
addopts = "-m 'not live and not llm' --basetemp=.pytest_tmp"
